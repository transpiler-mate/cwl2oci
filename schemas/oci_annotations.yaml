$schema: https://json-schema.org/draft/2020-12/schema
$id: https://oras.land/docs/how_to_guides/manifest_annotations/
$ref: '#/$defs/OciAnnotations'

$defs:

  OciAnnotations:
    type: object
    required:
    - org.opencontainers.image.title
    - org.opencontainers.image.description
    - org.opencontainers.image.version
    - org.opencontainers.image.licenses
    - org.cwl.entrypoint
    - org.cwl.type
    properties:
      org.opencontainers.image.title:
        type: string
        description: |
          The `org.opencontainers.image.title` property
      org.opencontainers.image.description:
        type: string
        description: |
          The `org.opencontainers.image.description` property
      org.opencontainers.image.version:
        type: string
        description: |
          The `org.opencontainers.image.version` property
      org.opencontainers.image.source:
        type: string
        description: |
          The `org.opencontainers.image.source` property
      org.opencontainers.image.revision:
        type: string
        description: |
          The `org.opencontainers.image.revision` property
      org.opencontainers.image.licenses:
        type: string
        description: |
          The `org.opencontainers.image.licenses` property
      org.cwl.entrypoint:
        type: string
        description: |
          The `org.cwl.entrypoint` property
      org.cwl.spec:
        type: string
        description: |
          The `org.cwl.spec` property
      org.cwl.type:
        type: string
        description: |
          The `org.cwl.type` property
